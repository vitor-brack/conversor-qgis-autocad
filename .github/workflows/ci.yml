name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    # O programa é só para Windows (janela em tkinter, GDAL e PROJ empacotados
    # para Windows), então os testes rodam no Windows, na mesma versão do Python
    # que o README pede. O runner não tem o Bookman Old Style nem o Arial Rounded
    # MT Bold (vêm com o Office): os testes que dependem deles são pulados.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar as dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Rodar os testes
        # No runner, a saída vai para um pipe em cp1252, e os acentos viram "�" no log.
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -v
